[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpcs-fit"
version = "0.1.0"
description = "Bayesian-optimization / VarPro vs. classical curve_fit benchmarking for XPCS g2 diffusion-coefficient fitting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["xpcs_fit*"]
